# ==========================================================================
# 网关配置：用户端网页 + 管理后台 + 后端接口（HTTP + 反向代理 + 限流）
# 需要 HTTPS 时看文件最下面的「可选：开启 HTTPS」说明。
# ==========================================================================

# ===== 限流区（Nginx 层，和后端限流配合，形成两道防线）=====
limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=llm_zone:10m   rate=2r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

upstream travel_backend {
    server backend:3200;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ================= 对外入口（HTTP 80）=================
server {
    listen 80;
    server_name _;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    client_max_body_size 20m;
    limit_conn conn_zone 50;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 健康检查（给负载均衡/运维探活用）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---------------- 用户端网页（travel-web）----------------
    root /usr/share/nginx/html/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ---------------- 管理后台（travel-admin，挂在 /admin/）----------------
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------------- 后端接口 ----------------
    # /api/xxx -> http://backend:3200/xxx（和前端开发时 vite 的代理规则一致）
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;

        proxy_pass http://travel_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    # AI 对话：SSE 流式，必须关缓冲，超时给长一点，限流更严格
    location /api/travel/chat {
        limit_req zone=llm_zone burst=5 nodelay;

        proxy_pass http://travel_backend/travel/chat;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # AI 生成类接口（行程规划 / 简介）：调用大模型，单独限流
    location /api/travel/recommend {
        limit_req zone=llm_zone burst=5 nodelay;

        proxy_pass http://travel_backend/travel/recommend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
    }

    location /api/travel/intro {
        limit_req zone=llm_zone burst=10 nodelay;

        proxy_pass http://travel_backend/travel/intro;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 登录 / 注册：防撞库
    location /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;

        proxy_pass http://travel_backend/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
    }

    location /api/auth/register {
        limit_req zone=login_zone burst=5 nodelay;

        proxy_pass http://travel_backend/auth/register;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
    }

    location /api/admin/login {
        limit_req zone=login_zone burst=5 nodelay;

        proxy_pass http://travel_backend/admin/login;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
    }

    # 监控端点：只允许内网/本机访问
    location /actuator/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://travel_backend/actuator/;
        proxy_set_header Host $host;
    }
}

# ==========================================================================
# 可选：开启 HTTPS（等你有了域名和证书再做，不影响现在使用）
#
# 步骤：
#   1. 把域名证书放到 deploy/certs/ 目录，命名为 server.crt 和 server.key
#   2. compose 里给 gateway 打开 443 端口映射，并把 certs 目录挂进去：
#        ports:  - "80:80"  - "443:443"
#        volumes: - ./certs:/etc/nginx/certs:ro
#   3. 把上面的 server 块复制一份，改成：
#        listen 443 ssl;
#        http2 on;
#        ssl_certificate     /etc/nginx/certs/server.crt;
#        ssl_certificate_key /etc/nginx/certs/server.key;
#        ssl_protocols       TLSv1.2 TLSv1.3;
#      并给 80 端口那个 server 加一行 location / { return 301 https://$host$request_uri; }
#   4. docker compose up -d --build gateway
# ==========================================================================
