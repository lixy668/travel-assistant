server.port=3200

llm.base-url=https://api.deepseek.com
llm.model=deepseek-chat
# DeepSeek API Key 从环境变量读取
llm.api-key=${DEEPSEEK_API_KEY:}

# ===== 高德地图（酒店/景点真实数据）=====
amap.key=${AMAP_KEY:}

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/travel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== JWT =====
jwt.secret=${JWT_SECRET:}
jwt.expire=604800000
# Tomcat
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=200
server.tomcat.max-connections=10000

# Hikari 连接池
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Redis（本地默认）
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 暴露监控指标给 Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=travel-assistant

# ===== 接口限流（按客户端 IP，每分钟；0 表示不限制）=====
ratelimit.enabled=${RATELIMIT_ENABLED:true}
ratelimit.per-minute=${RATELIMIT_PER_MINUTE:120}
ratelimit.llm-per-minute=${RATELIMIT_LLM_PER_MINUTE:20}
ratelimit.order-per-minute=${RATELIMIT_ORDER_PER_MINUTE:30}
ratelimit.login-per-minute=${RATELIMIT_LOGIN_PER_MINUTE:10}

# ===== 跨域来源（上线时用环境变量收紧成自己的域名）=====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
